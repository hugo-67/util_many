name: Verify accelerated Omura LTSA

on:
  push:
    branches:
      - feature/ltsa-audio-annotator
    paths:
      - .github/workflows/verify-omura-ltsa-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ltsa-audio-annotator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy soundfile psutil playwright
          python -m playwright install --with-deps chromium
      - name: Compile and run the complete non-large audio annotator suite
        run: |
          python -m py_compile ltsa_batch.py tests/audio_annotator_v2/ltsa_test.py
          python tests/audio_annotator_v2/run.py --suite all
      - name: Run a real batch job with the Omura fast-scan preset
        run: |
          rm -rf /tmp/omura-ltsa-ci
          python ltsa_batch.py sample/251006_001_0002.WAV \
            --config sample/ltsa_omuras_whale_fast_scan.json \
            --output-dir /tmp/omura-ltsa-ci \
            --backend cpu --jobs 1 --threads-per-worker 2 --overwrite
          test -s /tmp/omura-ltsa-ci/251006_001_0002.ltsa
          test -s /tmp/omura-ltsa-ci/ltsa_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/omura-ltsa-ci/ltsa_manifest.json').read_text())
          assert manifest['results'][0]['status'] == 'ok', manifest
          assert manifest['results'][0]['analysis_sample_rate'] == 256, manifest
          print(json.dumps(manifest['resource_plan'], indent=2))
          PY
      - name: Remove this temporary verification workflow
        if: success()
        run: |
          rm -f .github/workflows/verify-omura-ltsa-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Omura LTSA verification workflow [skip ci]"
          git push origin HEAD:feature/ltsa-audio-annotator

name: Apply Omura LTSA acceleration patch

on:
  push:
    branches:
      - feature/ltsa-audio-annotator
    paths:
      - .github/workflows/apply-omura-ltsa-patch-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ltsa-audio-annotator
          fetch-depth: 0
      - name: Verify and apply source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/omura-payload/part-* | base64 -d > /tmp/omura_patch.tar.xz
          echo "debecb3ecb6995ec11b59c0986a79ed2fd63ac13b6efcbc00826c0395ac083c7  /tmp/omura_patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/omura_patch.tar.xz -C .
          rm -rf .github/omura-payload
          rm -f .github/workflows/apply-omura-ltsa-patch-temp.yml
          python -m py_compile ltsa_batch.py tests/audio_annotator_v2/ltsa_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accelerate LTSA for Omura's whale PAM surveys [skip ci]"
          git push origin HEAD:feature/ltsa-audio-annotator
